[project]
name = "tracking-upsampling-tx"
version = "0.1.0"
description = "Transformer upsampling of bounding-box detections"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "OpenAI", email = "contact@example.com"}
]
dependencies = [
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "hydra-core>=1.3",
    "numpy-quaternion",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

